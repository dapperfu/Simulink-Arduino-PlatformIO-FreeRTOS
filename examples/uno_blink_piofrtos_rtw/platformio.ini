; Generated by the Arduino FreeRTOS (PlatformIO) Simulink target.
; Model: uno_blink

[platformio]
src_dir = .
include_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<ert_main.c>
    -<ert_main.cpp>
    -<rt_main.c>
    -<rt_main.cpp>
    -<rt_malloc_main.c>
    -<rt_malloc_main.cpp>
    -<piofrtos_main.cpp>
build_flags =
    -I.
    -I"$(START_DIR)"
    -I"C:/projects/Simulink-Arduino-FreeRTOS-PIO/src/drivers"
    -I"$(START_DIR)/uno_blink_piofrtos_rtw"
    -I"$(MATLAB_ROOT)/extern/include"
    -I"$(MATLAB_ROOT)/simulink/include"
    -I"$(MATLAB_ROOT)/rtw/c/src"
    -I"$(MATLAB_ROOT)/rtw/c/src/ext_mode/common"
    -I"$(MATLAB_ROOT)/rtw/c/ert"
    -DMODEL=uno_blink
    -DNUMST=1
lib_deps =
    feilipu/FreeRTOS
